<div class="app-shell">
  <p-toolbar class="app-toolbar">
    <ng-template #start>
      <span class="brand">Dashboard</span>

      <nav class="app-nav" aria-label="Sections">
        <a class="nav-link" routerLink="/tasks" routerLinkActive="nav-link-active">
          <i class="pi pi-list" aria-hidden="true"></i>
          <span>Tasks</span>
        </a>
        <a class="nav-link" routerLink="/mining" routerLinkActive="nav-link-active">
          <i class="pi pi-book" aria-hidden="true"></i>
          <span>Mining</span>
        </a>
      </nav>
    </ng-template>

    <ng-template #end>
      <p-button
        [icon]="themeIcon()"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        [ariaLabel]="darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
        (onClick)="toggleTheme()"
      />
    </ng-template>
  </p-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
